name: CI/CD

on:
  push:
    branches: [main]
    paths: ['form-app/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['form-app/**', '.github/workflows/deploy.yml']

# id-token: write lets the job ask GitHub for a short-lived OIDC token to log in to Azure
permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: samyak-form-app-7762
  APP_DIR: form-app

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the tests; same host/port/db the tests default to
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: form_app_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: form-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: form-app/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    # Only deploy when code lands on main, never for pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure runs `npm install` itself (SCM_DO_BUILD_DURING_DEPLOYMENT=true), so we ship source only
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.APP_DIR }}
