# Local development database. Start: npm run db:up   Stop: npm run db:down
# Bound to 127.0.0.1 only, so the weak local password is not reachable from the network.
# Host port is 5433 because 5432 is often taken by other Postgres containers.
services:
  postgres:
    image: postgres:17
    container_name: form-app-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: form_app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - form_app_pgdata:/var/lib/postgresql/data
      # Creates a second, separate database for automated tests (runs on first start only)
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d form_app"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  form_app_pgdata:
